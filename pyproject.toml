[project]
name = "markdown-anki-decks"
version = "1.1.1"
description = "A command line program to convert markdown files into anki decks."
authors = [
    { name = "Luke Murray", email = "lukepigeonmail@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.7.0,<4"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Education",
]
dependencies = [
    "beautifulsoup4>=4.10.0",
    "colorama>=0.4.4",
    "genanki>=0.13.0",
    "markdown>=3.3.6",
    "python-frontmatter>=1.0.0",
    "shellingham>=1.4.0",
    "typer>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/lukesmurray/markdown-anki-decks"
Repository = "https://github.com/lukesmurray/markdown-anki-decks"

[project.scripts]
mdankideck = "markdown_anki_decks.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.1.1,<8",
    "black>=22.1.0,<23",
    "flake8>=3.8.4,<4",
    "commitizen>=2.21.2,<3",
    "pre-commit>=2.17.0,<3",
    "Pygments>=2.11.2,<3",
    "pygments-graphql>=1.0.0,<2",
    "mypy>=0.941,<0.942",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markdown_anki_decks"]

[tool.commitizen]
version = "1.1.1"
version_files = ["pyproject.toml:version", "markdown_anki_decks/__init__.py"]
update_changelog_on_bump = true
